<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nocturne — an engraved moonlit wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #9aa4c8;
    font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">This wallpaper needs WebGL.<br>Enable hardware acceleration and reload.</div>
<script>
"use strict";
/* ──────────────────────────────────────────────────────────────────────────
   NOCTURNE  ·  an engraved moonlit live wallpaper
   ----------------------------------------------------------------------------
   An original procedural night scene — vast starfield, a glowing moon, a
   distant gothic spire and a lone figure on misty ground — rendered in a
   hand-engraved stipple style (à la Doré). Your cursor is a lantern that
   reveals the etching around it. Calm, melancholic, alive.
   Single WebGL fragment shader. Zero dependencies. MIT.
   ────────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false })
        || canvas.getContext('experimental-webgl');
if (!gl) { document.getElementById('err').style.display = 'grid'; throw new Error('no webgl'); }

/* ── Live-editable settings (Lively / Wallpaper Engine) ─────────────────── */
const cfg = {
  tint: 0,        // 0 moonlit  1 sepia  2 mono  3 night-blue
  grain: 55,      // 0..100 film grain
  exposure: 50,   // 0..100 brightness
  density: 50,    // 0..100 stipple density
  parallax: true,
  lantern: true,
  audio: true,
};

const VERT = `attribute vec2 aPosition; varying vec2 vUv;
  void main(){ vUv = aPosition*0.5+0.5; gl_Position = vec4(aPosition,0.0,1.0); }`;

const FRAG = `
precision highp float;
varying vec2 vUv;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;
uniform float uLantern;   // eased cursor-light strength
uniform float uFlash;     // click flash
uniform float uParallax;
uniform float uGrain;
uniform float uExposure;
uniform float uDensity;
uniform int   uTint;
uniform float uAudio;

float aspect;

float hash21(vec2 p){ p = fract(p*vec2(123.34,345.45)); p += dot(p, p+34.345); return fract(p.x*p.y); }
float n2(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash21(i), b=hash21(i+vec2(1.,0.)), c=hash21(i+vec2(0.,1.)), d=hash21(i+vec2(1.,1.));
  vec2 u=f*f*(3.-2.*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<6;i++){ v+=a*n2(p); p=p*1.92+vec2(1.3,-2.1); a*=.5; } return v; }
float ign(vec2 c){ return fract(52.9829189*fract(dot(c, vec2(0.06711056,0.00583715)))); } // dither

void main(){
  aspect = uRes.x/uRes.y;
  vec2 uv = vUv;
  float horizon = 0.36;

  vec2 par = (uMouse-0.5)*uParallax;
  vec2 suv = uv + par*vec2(0.018,0.012);
  vec2 guv = uv + par*vec2(0.055,0.006);

  // sky — near black, only faintly lifted toward the horizon
  float L = mix(0.003, 0.045, smoothstep(1.0, horizon, suv.y));

  // moon + tight halo
  vec2 mp = vec2(0.72, 0.78);
  vec2 dM = (suv-mp); dM.x*=aspect;
  float md = length(dM);
  float moonGlow = pow(smoothstep(0.22,0.0,md), 2.8)*0.36*(0.85+0.3*uAudio);
  float moonCore = smoothstep(0.044,0.040,md);
  L += moonGlow + smoothstep(0.054,0.046,md)*0.10;

  // stars (sky only, crisp)
  {
    vec2 sp = suv*vec2(aspect,1.0)*150.0;
    vec2 ip=floor(sp), fp=fract(sp);
    float h=hash21(ip);
    float present = step(0.972, h);
    vec2 cc = vec2(hash21(ip+3.1), hash21(ip+7.7));
    float d = length(fp-cc);
    float star = present*smoothstep(0.16,0.0,d);
    float tw = 0.55+0.45*sin(uTime*1.5 + h*60.0);
    L += star*(0.8+0.7*tw)*smoothstep(horizon-0.02, horizon+0.16, suv.y);
  }

  // shooting star (rare)
  {
    float period = 11.0; float ph = floor(uTime/period);
    float tt = fract(uTime/period)*period;
    vec2 a = vec2(hash21(vec2(ph,1.0))*0.5+0.15, 0.96);
    vec2 dir = normalize(vec2(0.8, -0.42));
    vec2 pos = a + dir*tt*0.18;
    vec2 dd = (suv-pos); dd.x*=aspect;
    float along = dot(dd, -dir);
    float perp  = abs(dot(dd, vec2(-dir.y, dir.x)));
    float trail = step(0.0, along)*step(along, 0.06)*(1.0-along/0.06);
    float meteor = trail*smoothstep(0.0022,0.0, perp)*step(tt,1.0)*step(suv.y,0.95);
    L += meteor*0.9;
  }

  // distant gothic spire (lit stone against the sky)
  {
    float sx = 0.30 + par.x*0.008;
    float gB = horizon-0.01, gT = 0.80;
    float t = smoothstep(gB, gT, suv.y);
    float w = mix(0.050, 0.0, pow(t,0.5));               // narrow, sharp pinnacle
    w *= 0.80 + 0.20*sin((suv.x-sx)*120.0);              // fine vertical ridges
    w *= 1.0 - 0.45*smoothstep(0.45,0.5, fract(t*3.0));  // stepped tiers (cathedral)
    float dx = abs(suv.x-sx);
    float inR = step(gB,suv.y)*step(suv.y,gT);
    float str = fbm(vec2((suv.x-sx)*100.0, suv.y*52.0));
    float body = smoothstep(w, w-0.0022, dx)*inR*smoothstep(0.26,0.60, str*0.55+0.52);
    float rim = smoothstep(w, 0.0, (suv.x-sx))*0.12;     // moon-facing edge brighter
    float lit = 0.12 + 0.26*str + rim;
    L = mix(L, lit, body);
  }

  // ground — reads as lit, undulating terrain (texture concentrated here)
  float crest = horizon + (fbm(vec2(guv.x*1.8+20.0, 5.0))-0.5)*0.045;
  float gmask = smoothstep(0.004,-0.004, guv.y-crest);
  float macro = fbm(vec2(guv.x*3.0, guv.y*4.0+2.0));
  float micro = fbm(vec2(guv.x*aspect, guv.y)*vec2(30.0,42.0));
  float gdist = smoothstep(horizon, 0.02, guv.y);          // 1 near viewer
  float lightSide = 0.7 + 0.45*smoothstep(0.0,1.0,guv.x);  // brighter toward the moon
  float gLight = (mix(0.10,0.42,gdist) + (micro-0.5)*mix(0.06,0.20,gdist) + (macro-0.5)*0.11) * lightSide;
  L = mix(L, max(gLight,0.04), gmask);

  // low fog band hugging the horizon
  float fog = smoothstep(horizon+0.12, horizon, guv.y) * smoothstep(horizon-0.10, horizon+0.02, guv.y);
  fog *= 0.55 + 0.45*fbm(vec2(guv.x*3.0 - uTime*0.04, 4.0 + uTime*0.04));
  L = mix(L, max(L, 0.085), clamp(fog,0.0,1.0)*0.7);

  // lone hooded figure (foreground silhouette on the lit ground)
  {
    vec2 c = vec2(0.5, horizon-0.035);
    vec2 d = (guv-c); d.x*=aspect;
    float halfW = 0.012 + max(0.0,(c.y-guv.y))*0.30;       // cloak flares to the ground
    float top = c.y+0.045, bot = c.y-0.075;
    float within = smoothstep(bot-0.008,bot+0.005,guv.y)*smoothstep(top+0.010,top-0.018,guv.y);
    float cloak = smoothstep(halfW+0.004, halfW-0.003, abs(d.x)) * within;
    float head  = smoothstep(0.001,0.0, length((guv-(c+vec2(0.0,0.052)))*vec2(aspect,1.0))-0.016);
    float fig = clamp(cloak+head, 0.0, 1.0);
    L += smoothstep(0.13,0.0, length((guv-c)*vec2(aspect,1.0)))*0.022; // faint ground halo
    L = mix(L, 0.006, fig);
  }

  // cursor lantern reveal
  {
    vec2 d=(uv-uMouse); d.x*=aspect;
    L += pow(smoothstep(0.32,0.0,length(d)),2.0)*uLantern*0.5;
  }

  // click flash (distant lightning, over the sky)
  L += uFlash*0.20*smoothstep(0.0, horizon+0.2, uv.y);

  // exposure + vignette
  L *= mix(0.8, 1.3, uExposure);
  vec2 q=uv-0.5; q.x*=aspect;
  L *= mix(0.4, 1.0, smoothstep(1.15, 0.18, length(q)));
  L = clamp(L, 0.0, 1.3);

  // engraving / stipple stylise — dark stays clean black, lit areas stipple
  float px = 1.6;
  vec2 fc = floor(gl_FragCoord.xy/px);
  float thr = mix(ign(fc), hash21(fc), 0.45);
  float stip = step(thr, L*mix(0.85,1.25,uDensity));
  float core = smoothstep(0.60, 0.95, L);                 // bright light sources stay solid
  float vis = max(max(stip, core), moonCore);

  vec3 ink = uTint==1 ? vec3(1.0,0.90,0.74)
           : uTint==2 ? vec3(1.0)
           : uTint==3 ? vec3(0.70,0.81,1.0)
                      : vec3(0.85,0.90,1.0);
  vec3 col = ink*vis;
  col *= 1.0 - (hash21(gl_FragCoord.xy + fract(uTime)*vec2(13.1,7.7)))*uGrain*0.08; // subtle grain
  col += vec3(0.006,0.008,0.013); // faint cool base so black isn't dead
  gl_FragColor = vec4(col, 1.0);
}`;

/* ── Compile ────────────────────────────────────────────────────────────── */
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.bindAttribLocation(prog, 0, 'aPosition');
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U = {}; ['uRes','uTime','uMouse','uLantern','uFlash','uParallax','uGrain','uExposure','uDensity','uTint','uAudio']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* ── State ──────────────────────────────────────────────────────────────── */
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,1.0);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  gl.viewport(0,0,canvas.width,canvas.height); }
window.addEventListener('resize', resize);

const mouse={x:0.5,y:0.62,tx:0.5,ty:0.62}; let lantern=0, lanternT=0, flash=0;
window.addEventListener('mousemove', e=>{ mouse.tx=e.clientX/window.innerWidth; mouse.ty=1-e.clientY/window.innerHeight; lanternT=1.0; });
window.addEventListener('mousedown', ()=>{ flash=1.0; });
window.addEventListener('touchstart', e=>{ const t=e.touches[0]; mouse.tx=t.clientX/window.innerWidth; mouse.ty=1-t.clientY/window.innerHeight; lanternT=1.0; flash=0.7; }, {passive:true});

let audio=0, audioT=0;
function feedAudio(arr){ if(!cfg.audio||!arr||!arr.length) return; let s=0,n=Math.min(48,arr.length);
  for(let i=0;i<n;i++) s+=Math.abs(arr[i]); audioT=Math.min(1.0,(s/n)*2.0); }
window.livelyAudioListener=feedAudio;
if(typeof window.wallpaperRegisterAudioListener==='function') window.wallpaperRegisterAudioListener(feedAudio);

function applyProp(name,val){ switch(name){
  case 'tint': cfg.tint=+val; break;
  case 'grain': cfg.grain=+val; break;
  case 'exposure': cfg.exposure=+val; break;
  case 'density': cfg.density=+val; break;
  case 'parallax': cfg.parallax=!!val; break;
  case 'lantern': cfg.lantern=!!val; break;
  case 'audio': cfg.audio=!!val; break;
}}
window.livelyPropertyListener=applyProp;
window.wallpaperPropertyListener={ applyUserProperties(p){ for(const k in p){ let v=p[k].value;
  if(typeof v==='string'&&/^\d+$/.test(v)) v=+v; applyProp(k,v);} } };

let running=true;
document.addEventListener('visibilitychange',()=>{ running=!document.hidden; if(running){ last=performance.now(); requestAnimationFrame(frame);} });

/* ── Loop ───────────────────────────────────────────────────────────────── */
let last=performance.now(), t=0, acc=0; const FRAME=1000/40;
function frame(now){
  if(!running) return;
  acc += now-last; last=now;
  if(acc<FRAME){ requestAnimationFrame(frame); return; }
  const dt=Math.min(3,acc/16.667); acc=0; t+=dt*0.016;

  mouse.x+=(mouse.tx-mouse.x)*0.06; mouse.y+=(mouse.ty-mouse.y)*0.06;
  lanternT*=0.99; lantern+=((cfg.lantern?lanternT:0)-lantern)*0.08;
  flash*=Math.pow(0.9,dt);
  audio+=(audioT-audio)*0.15; audioT*=0.94;

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform2f(U.uMouse, mouse.x, mouse.y);
  gl.uniform1f(U.uLantern, lantern);
  gl.uniform1f(U.uFlash, flash);
  gl.uniform1f(U.uParallax, cfg.parallax?1:0);
  gl.uniform1f(U.uGrain, cfg.grain/100);
  gl.uniform1f(U.uExposure, cfg.exposure/100);
  gl.uniform1f(U.uDensity, cfg.density/100);
  gl.uniform1i(U.uTint, cfg.tint|0);
  gl.uniform1f(U.uAudio, audio);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
