<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Petrichor — rain on glass</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #9aa4c8;
    font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">This wallpaper needs WebGL2.<br>Enable hardware acceleration and reload.</div>
<script>
"use strict";
/* ──────────────────────────────────────────────────────────────────────────
   PETRICHOR  ·  rain on glass
   ----------------------------------------------------------------------------
   A beautiful night image seen through a wet, fogged-up window. Animated
   droplets refract and sharpen the lights behind the glass; trails slide down;
   the whole pane is softly frosted — and your cursor wipes it clear like a hand
   on a misted window. Ships with a dreamy bokeh "city lights" scene; drop in any
   image you like (bg.jpg or a URL) for your own.
   Rain-on-glass technique after BigWIngs' "Heartfelt" (Shadertoy). WebGL2. MIT.
   ────────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false });
if (!gl) { document.getElementById('err').style.display='grid'; throw new Error('no webgl2'); }

/* ── Settings (live-editable via Lively / Wallpaper Engine) ─────────────── */
const cfg = {
  scene: 0,       // built-in bokeh scene (used when no image URL set)
  image: '',      // optional image URL; overrides the scene when it loads
  rain: 60,       // 0..100 rain amount
  frost: 55,      // 0..100 how fogged the glass is
  zoom: 18,       // 0..100 background zoom
  brightness: 52, // 0..100
  vignette: 60,   // 0..100
  grain: 35,      // 0..100
  tint: 0,        // 0 natural 1 warm 2 mono 3 cool
  parallax: true,
  wipe: true,     // cursor wipes the fog
};

/* ── Shaders (GLSL ES 3.00) ─────────────────────────────────────────────── */
const VS = `#version 300 es
in vec2 aPosition; out vec2 vUv;
void main(){ vUv = aPosition*0.5+0.5; gl_Position = vec4(aPosition,0.0,1.0); }`;

const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform sampler2D uTex;
uniform vec2 uRes, uImgRes, uMouse;
uniform float uTime, uRain, uFrost, uZoom, uBright, uVig, uGrain, uParallax, uWipe;
uniform int uTint;

float N(float t){ return fract(sin(t*12345.564)*7658.76); }
float Saw(float b, float t){ return smoothstep(0.,b,t)*smoothstep(1.,b,t); }
vec3 N13(float p){
  vec3 p3=fract(vec3(p)*vec3(.1031,.11369,.13787));
  p3+=dot(p3,p3.yzx+19.19);
  return fract(vec3((p3.x+p3.y)*p3.z,(p3.x+p3.z)*p3.y,(p3.y+p3.z)*p3.x));
}
vec2 DropLayer2(vec2 uv, float t){
  vec2 UV=uv; uv.y+=t*0.75;
  vec2 a=vec2(6.,1.), grid=a*2.;
  vec2 id=floor(uv*grid);
  float colShift=N(id.x); uv.y+=colShift;
  id=floor(uv*grid);
  vec3 n=N13(id.x*35.2+id.y*2376.1);
  vec2 st=fract(uv*grid)-vec2(.5,0.);
  float x=n.x-.5;
  float y=UV.y*20.;
  float wiggle=sin(y+sin(y));
  x+=wiggle*(.5-abs(x))*(n.z-.5); x*=.7;
  float ti=fract(t+n.z);
  y=(Saw(.85,ti)-.5)*.9+.5;
  vec2 p=vec2(x,y);
  float d=length((st-p)*a.yx);
  float mainDrop=smoothstep(.4,.0,d);
  float r=sqrt(smoothstep(1.,y,st.y));
  float cd=abs(st.x-x);
  float trail=smoothstep(.23*r,.15*r*r,cd);
  float trailFront=smoothstep(-.02,.02,st.y-y);
  trail*=trailFront*r*r;
  y=UV.y; float trail2=smoothstep(.2*r,.0,cd);
  float droplets=max(0.,(sin(y*(1.-y)*120.)-st.y))*trail2*trailFront*n.z;
  y=fract(y*10.)+(st.y-.5);
  float dd=length(st-vec2(x,y));
  droplets=smoothstep(.3,0.,dd);
  float m=mainDrop+droplets*r*trailFront;
  return vec2(m, trail);
}
float StaticDrops(vec2 uv, float t){
  uv*=40.;
  vec2 id=floor(uv); uv=fract(uv)-.5;
  vec3 n=N13(id.x*107.45+id.y*3543.654);
  vec2 p=(n.xy-.5)*.7;
  float d=length(uv-p);
  float fade=Saw(.025,fract(t+n.z));
  return smoothstep(.3,0.,d)*fract(n.z*10.)*fade;
}
vec2 Drops(vec2 uv, float t, float l0, float l1, float l2){
  float s=StaticDrops(uv,t)*l0;
  vec2 m1=DropLayer2(uv,t)*l1;
  vec2 m2=DropLayer2(uv*1.85,t)*l2;
  float c=s+m1.x+m2.x;
  c=smoothstep(.3,1.,c);
  return vec2(c, max(m1.y*l0, m2.y*l1));
}

void main(){
  vec2 fc = vUv*uRes;
  float aspect = uRes.x/uRes.y;
  vec2 uv = (fc-0.5*uRes)/uRes.y;
  uv *= 0.7;
  float t = uTime*0.2;

  float rain = uRain;
  float l0 = smoothstep(-.5,1.,rain)*2.0;
  float l1 = smoothstep(.25,.75,rain);
  float l2 = smoothstep(.0,.5,rain);

  vec2 c = Drops(uv, t, l0, l1, l2);
  vec2 e = vec2(.0015, 0.);
  float cx = Drops(uv+e,    t, l0, l1, l2).x;
  float cy = Drops(uv+e.yx, t, l0, l1, l2).x;
  vec2 n = vec2(cx-c.x, cy-c.x);

  // background cover-fit uv
  float cover = max(uRes.x/uImgRes.x, uRes.y/uImgRes.y);
  vec2 size = uImgRes*cover;
  vec2 buv = (fc-(uRes-size)*0.5)/size;
  vec2 par = (uMouse-0.5)*uParallax*0.02;
  buv = (buv-0.5)/(1.0+uZoom*0.6) + 0.5 + par + vec2(sin(uTime*0.03)*0.004, 0.0);
  buv.y = 1.0 - buv.y;

  // fog: how frosted the glass is here (cleared by drops/trails and the cursor)
  vec2 dm = vUv-uMouse; dm.x*=aspect;
  float wipe = smoothstep(0.17,0.0,length(dm))*uWipe;
  float clearAmt = clamp(c.x + c.y*0.7, 0.0, 1.0);
  float fog = (1.0-clearAmt)*(1.0-wipe)*uFrost;

  float maxBlur = mix(2.5, 6.0, uFrost);
  float lod = mix(0.0, maxBlur, fog);
  vec3 col = textureLod(uTex, buv + n*1.1, lod).rgb;

  // frosted whitening + condensation
  vec3 fogTint = uTint==1 ? vec3(0.86,0.80,0.72) : vec3(0.74,0.80,0.92);
  col = mix(col, fogTint*0.45, fog*0.45);
  col += c.x*0.05;                       // tiny droplet highlight

  // grade
  col *= mix(0.65, 1.35, uBright);
  if (uTint==1) col *= vec3(1.08,1.0,0.86);
  else if (uTint==2){ float g=dot(col,vec3(.299,.587,.114)); col=vec3(g); }
  else if (uTint==3) col *= vec3(0.82,0.88,1.08);

  vec2 q = vUv-0.5; q.x*=aspect;
  col *= mix(1.0, smoothstep(1.15,0.25,length(q)), uVig);
  col *= 1.0 - N13(vUv.x*1234.5 + vUv.y*678.9 + fract(uTime)*51.7).x*uGrain*0.09;
  col = max(col, 0.0);
  frag = vec4(col, 1.0);
}`;

/* ── Compile / link ─────────────────────────────────────────────────────── */
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.bindAttribLocation(prog, 0, 'aPosition');
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ['uTex','uRes','uImgRes','uMouse','uTime','uRain','uFrost','uZoom','uBright','uVig','uGrain','uParallax','uWipe','uTint']
  .forEach(k=>U[k]=gl.getUniformLocation(prog,k));

/* ── Background texture (built-in bokeh scene, or user image) ───────────── */
const tex = gl.createTexture();
let imgW=1280, imgH=720;
function setTexture(source, w, h){
  imgW=w; imgH=h;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
}
// dreamy out-of-focus "city lights at night" — smooth bokeh, never stippled
const SCENES = [
  { name:'City lights', grad:['#070a16','#0a1020','#05060c'], pal:[[120,150,255],[90,200,255],[255,170,90],[255,90,80],[180,140,255],[120,255,210],[255,225,150]] },
  { name:'Blue hour',   grad:['#04060f','#0a1428','#04060e'], pal:[[90,140,255],[120,180,255],[80,200,235],[150,160,255],[200,220,255]] },
  { name:'Amber',       grad:['#100a08','#1a0f0a','#080604'], pal:[[255,170,80],[255,120,60],[255,210,140],[255,90,70],[230,160,90]] },
  { name:'Neon',        grad:['#0a0612','#120a20','#05030a'], pal:[[255,60,170],[80,230,255],[170,90,255],[60,255,180],[255,90,90]] },
  { name:'Forest',      grad:['#05100a','#0a1a12','#040806'], pal:[[120,255,180],[90,200,150],[180,255,200],[120,230,255],[230,255,210]] },
];
function bokehScene(s){
  const cv=document.createElement('canvas'); cv.width=1280; cv.height=720;
  const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,0,720);
  g.addColorStop(0,s.grad[0]); g.addColorStop(0.55,s.grad[1]); g.addColorStop(1,s.grad[2]);
  x.fillStyle=g; x.fillRect(0,0,1280,720);
  x.globalCompositeOperation='lighter';
  let seed=987654321; const rnd=()=>{ seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5; return ((seed>>>0)/4294967296); };
  for(let i=0;i<52;i++){
    const cx=rnd()*1280, cy=110+rnd()*620, r=16+rnd()*130;
    const col=s.pal[(rnd()*s.pal.length)|0]; const a=0.06+rnd()*0.26;
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
    rg.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${a})`);
    rg.addColorStop(0.5,`rgba(${col[0]},${col[1]},${col[2]},${a*0.4})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,r,0,6.2832); x.fill();
  }
  const mg=x.createRadialGradient(980,150,0,980,150,95);  // soft moon / lamp
  mg.addColorStop(0,'rgba(225,232,255,0.55)'); mg.addColorStop(1,'rgba(225,232,255,0)');
  x.fillStyle=mg; x.beginPath(); x.arc(980,150,95,0,6.2832); x.fill();
  x.globalCompositeOperation='source-over';
  return cv;
}
let usingImage=false;
function showScene(){ setTexture(bokehScene(SCENES[cfg.scene]||SCENES[0]), 1280, 720); usingImage=false; }
function loadImage(url){
  url=(url||'').trim();
  if(!url){ showScene(); return; }
  const img=new Image();
  if(/^https?:/i.test(url)) img.crossOrigin='anonymous';   // only meaningful for web URLs
  img.onload=()=>{ try{ setTexture(img, img.naturalWidth||1280, img.naturalHeight||720); usingImage=true; }
                   catch(e){ showScene(); } };
  img.onerror=()=> showScene();
  img.src=url;
}
// instant + reliable scene first, then try the user's image if one is configured
showScene();
if (cfg.image && cfg.image.trim()) loadImage(cfg.image);

/* ── Sizing / input ─────────────────────────────────────────────────────── */
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,1.25);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  gl.viewport(0,0,canvas.width,canvas.height); }
window.addEventListener('resize', resize);

const mouse={x:0.5,y:0.5,tx:0.5,ty:0.5};
window.addEventListener('mousemove', e=>{ mouse.tx=e.clientX/window.innerWidth; mouse.ty=1-e.clientY/window.innerHeight; });
window.addEventListener('touchmove', e=>{ const t=e.touches[0]; mouse.tx=t.clientX/window.innerWidth; mouse.ty=1-t.clientY/window.innerHeight; }, {passive:true});

function applyProp(name,val){ switch(name){
  case 'scene': cfg.scene=+val; if(!usingImage) showScene(); break;
  case 'image': cfg.image=String(val); loadImage(cfg.image); break;
  case 'rain': cfg.rain=+val; break;
  case 'frost': cfg.frost=+val; break;
  case 'zoom': cfg.zoom=+val; break;
  case 'brightness': cfg.brightness=+val; break;
  case 'vignette': cfg.vignette=+val; break;
  case 'grain': cfg.grain=+val; break;
  case 'tint': cfg.tint=+val; break;
  case 'parallax': cfg.parallax=!!val; break;
  case 'wipe': cfg.wipe=!!val; break;
}}
window.livelyPropertyListener=applyProp;
window.wallpaperPropertyListener={ applyUserProperties(p){ for(const k in p){ let v=p[k].value;
  if(typeof v==='string'&&/^\d+$/.test(v)) v=+v; applyProp(k,v);} } };

let running=true;
document.addEventListener('visibilitychange',()=>{ running=!document.hidden; if(running){ last=performance.now(); requestAnimationFrame(frame);} });

/* ── Loop ───────────────────────────────────────────────────────────────── */
let last=performance.now(), t=0, acc=0; const FRAME=1000/45;
function frame(now){
  if(!running) return;
  acc+=now-last; last=now;
  if(acc<FRAME){ requestAnimationFrame(frame); return; }
  const dt=Math.min(3,acc/16.667); acc=0; t+=dt*0.016;
  mouse.x+=(mouse.tx-mouse.x)*0.07; mouse.y+=(mouse.ty-mouse.y)*0.07;

  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uTex,0);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uImgRes, imgW, imgH);
  gl.uniform2f(U.uMouse, mouse.x, mouse.y);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uRain, cfg.rain/100);
  gl.uniform1f(U.uFrost, cfg.frost/100);
  gl.uniform1f(U.uZoom, cfg.zoom/100);
  gl.uniform1f(U.uBright, cfg.brightness/100);
  gl.uniform1f(U.uVig, cfg.vignette/100);
  gl.uniform1f(U.uGrain, cfg.grain/100);
  gl.uniform1f(U.uParallax, cfg.parallax?1:0);
  gl.uniform1f(U.uWipe, cfg.wipe?1:0);
  gl.uniform1i(U.uTint, cfg.tint|0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
