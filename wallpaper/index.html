<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Living Scenery — interactive scenic wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  /* photo backdrops (two for smooth crossfade) */
  .bg { background-size: cover; background-position: center; background-repeat: no-repeat;
        will-change: transform, opacity; transition: opacity 1.1s ease;
        transform: scale(1.08); opacity: 0; }
  #grade    { mix-blend-mode: soft-light; opacity: 0; transition: background 2s, opacity 2s; }
  #vignette { background: radial-gradient(120% 110% at 50% 46%,
                rgba(0,0,0,0) 42%, rgba(0,0,0,0.28) 78%, rgba(0,0,0,0.6) 100%); }
  #fx { z-index: 4; }
  #grain { z-index: 5; mix-blend-mode: overlay; opacity: 0.05; }
  #bgA { z-index: 0; } #bgB { z-index: 0; }
  #grade { z-index: 2; } #vignette { z-index: 3; }
  #status { position: fixed; left: 16px; bottom: 14px; z-index: 9;
    font: 12px ui-sans-serif, system-ui, sans-serif; color: rgba(255,255,255,.55);
    text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; opacity: 0;
    transition: opacity .4s; }
</style>
</head>
<body>
<div id="bgA" class="layer bg"></div>
<div id="bgB" class="layer bg"></div>
<div id="grade" class="layer"></div>
<div id="vignette" class="layer"></div>
<canvas id="fx" class="layer"></canvas>
<div id="grain" class="layer"></div>
<div id="status"></div>
<script>
"use strict";
/* ──────────────────────────────────────────────────────────────────────────
   LIVING SCENERY  ·  interactive scenic live wallpaper
   ----------------------------------------------------------------------------
   A beautiful photo that comes alive: slow cinematic drift + mouse parallax,
   with layered, interactive weather painted on top — snow, rain, storms with
   lightning, drifting fog, sun god-rays, water sparkle, fireflies, petals —
   plus time-of-day colour grading, vignette and film grain for a cinematic feel.
   Use a built-in scenic photo, your own image (photos/custom.jpg or a URL), or a
   hand-drawn procedural mountain scene as an always-works fallback.
   Pure HTML/CSS/Canvas, single file, zero dependencies.
   ────────────────────────────────────────────────────────────────────────── */

/* ── Settings (live-editable via Lively / Wallpaper Engine) ─────────────── */
const cfg = {
  scene: 1,           // 0 Procedural 1..N built-in photos, then My Photo, Custom URL
  customUrl: '',
  weather: 1,         // 0 None 1 Snow 2 Rain 3 Storm 4 Fog 5 Sun rays 6 Sparkle 7 Fireflies 8 Petals
  intensity: 60,      // 0..100
  timeOfDay: 0,       // 0 Auto 1 Dawn 2 Day 3 Golden 4 Dusk 5 Night
  parallax: true,
  grain: true,
};

/* ── Scene catalogue ────────────────────────────────────────────────────── */
// Photos stream from Lorem Picsum's stable, hot-link-friendly CDN at runtime
// (on YOUR PC, which has internet). If a fetch fails we fall back to a crafted
// procedural mountain scene so the wallpaper is never broken or blank.
const PIC = id => `https://picsum.photos/id/${id}/1920/1080`;
const SCENES = [
  { name: 'Procedural Peaks', kind: 'proc' },
  { name: 'Mountain Lake',    kind: 'url', url: PIC(1018) },
  { name: 'River Canyon',     kind: 'url', url: PIC(1015) },
  { name: 'Canyon Valley',    kind: 'url', url: PIC(1016) },
  { name: 'Waterfall',        kind: 'url', url: PIC(1039) },
  { name: 'Forest',           kind: 'url', url: PIC(29)   },
  { name: 'Seascape',         kind: 'url', url: PIC(1043) },
  { name: 'My Photo',         kind: 'url', url: 'photos/custom.jpg' },
  { name: 'Custom URL',       kind: 'custom' },
];

/* ── Canvas sizing ──────────────────────────────────────────────────────── */
const fx = document.getElementById('fx');
const ctx = fx.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  fx.width = Math.floor(W * DPR); fx.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildWeather();
}
window.addEventListener('resize', resize);

/* ── Tiny seeded value-noise (for procedural ridges + organic motion) ───── */
const PERM = new Uint8Array(512);
(function seed(s){ const p=new Uint8Array(256); for(let i=0;i<256;i++)p[i]=i;
  s=(s>>>0)||1; const r=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];}
  for(let i=0;i<512;i++)PERM[i]=p[i&255]; })(7331);
const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+(b-a)*t;
function noise1(x){const X=Math.floor(x)&255;x-=Math.floor(x);const u=fade(x);
  const a=(PERM[X]/255)*2-1,b=(PERM[X+1]/255)*2-1;return lerp(a,b,u);}
const rand=(a,b)=>a+Math.random()*(b-a);

/* ── Procedural fallback scene (rendered once → data URL) ───────────────── */
function renderProcedural() {
  const c = document.createElement('canvas'); c.width = 1600; c.height = 900;
  const g = c.getContext('2d'); const w = c.width, h = c.height;
  // sky
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#1b2a52'); sky.addColorStop(0.45, '#3a4f86');
  sky.addColorStop(0.7, '#8a7fb0'); sky.addColorStop(1, '#e7a978');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  // sun
  const sx = w * 0.74, sy = h * 0.42;
  const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 260);
  sg.addColorStop(0, 'rgba(255,240,210,0.95)'); sg.addColorStop(0.3, 'rgba(255,210,150,0.6)');
  sg.addColorStop(1, 'rgba(255,210,150,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(sx, sy, 260, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(255,248,225,0.95)'; g.beginPath(); g.arc(sx, sy, 46, 0, 6.2832); g.fill();
  // layered ridges
  const ridge = [['#5a6a9a', 0.62, 0.10], ['#46527e', 0.70, 0.16], ['#333c63', 0.79, 0.22], ['#222843', 0.88, 0.30]];
  for (let L = 0; L < ridge.length; L++) {
    const [col, base, amp] = ridge[L];
    g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 8) {
      const n = noise1(x * 0.0016 * (1 + L * 0.4) + L * 30) * 0.5
              + noise1(x * 0.006 + L * 10) * 0.5;
      g.lineTo(x, h * base + n * h * amp);
    }
    g.lineTo(w, h); g.closePath(); g.fill();
  }
  // water + reflection at the very bottom
  const wy = h * 0.9;
  const wg = g.createLinearGradient(0, wy, 0, h);
  wg.addColorStop(0, 'rgba(60,80,120,0.7)'); wg.addColorStop(1, 'rgba(20,28,50,0.95)');
  g.fillStyle = wg; g.fillRect(0, wy, w, h - wy);
  g.globalAlpha = 0.25; g.fillStyle = '#fff';
  for (let i = 0; i < 60; i++) { const y = wy + Math.random() * (h - wy);
    g.fillRect(Math.random() * w, y, rand(20, 90), 1); }
  g.globalAlpha = 1;
  return c.toDataURL('image/jpeg', 0.86);
}

/* ── Scene loading + crossfade ──────────────────────────────────────────── */
const bgA = document.getElementById('bgA'), bgB = document.getElementById('bgB');
let bgFront = bgA, bgBack = bgB;
const statusEl = document.getElementById('status');
let procURL = null;
function showStatus(t) {
  statusEl.textContent = t; statusEl.style.opacity = '1';
  clearTimeout(showStatus._t); showStatus._t = setTimeout(() => statusEl.style.opacity = '0', 2200);
}
function applyBg(url) {
  bgBack.style.backgroundImage = `url("${url}")`;
  bgBack.style.opacity = '1';
  bgFront.style.opacity = '0';
  [bgFront, bgBack] = [bgBack, bgFront];
}
function loadScene(idx) {
  const s = SCENES[idx] || SCENES[0];
  if (s.kind === 'proc') {
    if (!procURL) procURL = renderProcedural();
    applyBg(procURL); showStatus(s.name); return;
  }
  let url = s.kind === 'custom' ? (cfg.customUrl || '').trim() : s.url;
  if (!url) { if (!procURL) procURL = renderProcedural(); applyBg(procURL);
    showStatus('Set a Custom URL in settings'); return; }
  showStatus('Loading ' + s.name + '…');
  const img = new Image();
  img.onload = () => { applyBg(url); showStatus(s.name); };
  img.onerror = () => { if (!procURL) procURL = renderProcedural(); applyBg(procURL);
    showStatus(s.name + ' unavailable — showing Procedural Peaks'); };
  img.src = url;
}

/* ── Mouse / wind / interaction ─────────────────────────────────────────── */
const mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, active: false };
let windX = 0.3, gust = 0;
let ripples = [];
function onMove(e){ const s=e.touches?e.touches[0]:e;
  mouse.tx=s.clientX/window.innerWidth; mouse.ty=s.clientY/window.innerHeight; mouse.active=true; }
window.addEventListener('mousemove', onMove);
function burst(e){ onMove(e); gust = 3.2 * (mouse.tx < 0.5 ? -1 : 1);
  ripples.push({ x: mouse.tx * W, y: mouse.ty * H, r: 0, life: 1 }); }
window.addEventListener('mousedown', burst);
window.addEventListener('touchstart', burst);

/* ── Time-of-day colour grade ───────────────────────────────────────────── */
function gradeForHour(h){
  if (h < 5.5)  return { c:'rgb(18,34,78)',  b:'multiply',  o:0.6 , dark:0.5 };
  if (h < 8)    return { c:'rgb(255,150,95)', b:'soft-light', o:0.38, dark:0.18 };
  if (h < 11)   return { c:'rgb(200,220,255)',b:'soft-light', o:0.12, dark:0.05 };
  if (h < 16)   return { c:'rgb(190,215,255)',b:'soft-light', o:0.10, dark:0.04 };
  if (h < 18.5) return { c:'rgb(255,170,80)', b:'soft-light', o:0.42, dark:0.12 };
  if (h < 20.5) return { c:'rgb(120,90,170)', b:'soft-light', o:0.42, dark:0.22 };
  return { c:'rgb(18,34,78)', b:'multiply', o:0.6, dark:0.5 };
}
const TOD = [ null,
  { c:'rgb(255,150,95)', b:'soft-light', o:0.38, dark:0.18 },   // dawn
  { c:'rgb(195,218,255)',b:'soft-light', o:0.10, dark:0.04 },   // day
  { c:'rgb(255,170,80)', b:'soft-light', o:0.42, dark:0.12 },   // golden
  { c:'rgb(120,90,170)', b:'soft-light', o:0.42, dark:0.22 },   // dusk
  { c:'rgb(18,34,78)',   b:'multiply',   o:0.6 , dark:0.5  } ]; // night
const gradeEl = document.getElementById('grade');
const vigEl = document.getElementById('vignette');
let curDark = 0.1, nightMix = 0;
function applyGrade(){
  const g = cfg.timeOfDay === 0 ? gradeForHour(new Date().getHours() + new Date().getMinutes()/60)
                                : TOD[cfg.timeOfDay];
  gradeEl.style.background = g.c; gradeEl.style.mixBlendMode = g.b; gradeEl.style.opacity = g.o;
  curDark = g.dark; nightMix = (g.b === 'multiply') ? 1 : 0;
  vigEl.style.opacity = String(0.85 + g.dark * 0.6);
}

/* ── Film grain overlay (CSS, animated offset) ──────────────────────────── */
const grainEl = document.getElementById('grain');
(function makeGrain(){
  const n = document.createElement('canvas'); n.width = n.height = 96;
  const g = n.getContext('2d'); const d = g.createImageData(96, 96);
  for (let i = 0; i < d.data.length; i += 4){ const v = (Math.random() * 255) | 0;
    d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  g.putImageData(d, 0, 0);
  grainEl.style.backgroundImage = `url("${n.toDataURL()}")`;
  grainEl.style.backgroundRepeat = 'repeat';
})();

/* ── Weather particle systems ───────────────────────────────────────────── */
let parts = [];
let fogSprite = null, glowSprite = null;
function makeSprite(stops){ const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); const rg=g.createRadialGradient(64,64,0,64,64,64);
  stops.forEach(s=>rg.addColorStop(s[0],s[1])); g.fillStyle=rg; g.fillRect(0,0,128,128); return c; }
function ensureSprites(){
  if (!fogSprite) fogSprite = makeSprite([[0,'rgba(255,255,255,0.5)'],[0.6,'rgba(255,255,255,0.18)'],[1,'rgba(255,255,255,0)']]);
  if (!glowSprite) glowSprite = makeSprite([[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,0.5)'],[1,'rgba(255,255,255,0)']]);
}
function count(base){ return Math.round(base * (0.25 + cfg.intensity / 100 * 1.4)); }
function buildWeather(){
  ensureSprites(); parts = [];
  const wx = W, hy = H, area = wx * hy;
  switch (cfg.weather){
    case 1: for (let i=0,n=count(area/3200);i<n;i++) parts.push({x:rand(0,wx),y:rand(0,hy),z:Math.random(),r:rand(1,3),sw:rand(8,26),ph:rand(0,6.28),sp:rand(20,55)}); break; // snow
    case 2: case 3: for (let i=0,n=count(area/2600);i<n;i++) parts.push({x:rand(0,wx),y:rand(0,hy),z:Math.random(),len:rand(10,22),sp:rand(420,720)}); break; // rain/storm
    case 4: for (let i=0,n=count(18);i<n;i++) parts.push({x:rand(-200,wx),y:rand(hy*0.25,hy),r:rand(180,420),sp:rand(4,16),a:rand(0.04,0.14)}); break; // fog
    case 6: for (let i=0,n=count(260);i<n;i++) parts.push({x:rand(0,wx),y:rand(hy*0.35,hy),ph:rand(0,6.28),sp:rand(1.5,4),r:rand(0.6,2)}); break; // sparkle
    case 7: for (let i=0,n=count(48);i<n;i++) parts.push({x:rand(0,wx),y:rand(hy*0.3,hy),vx:rand(-10,10),vy:rand(-8,8),ph:rand(0,6.28),sp:rand(1,2.6)}); break; // fireflies
    case 8: for (let i=0,n=count(150);i<n;i++) parts.push({x:rand(0,wx),y:rand(0,hy),vx:rand(-6,18),vy:rand(14,34),rot:rand(0,6.28),vr:rand(-2,2),s:rand(5,12),h:rand(330,30)}); break; // petals
  }
}

/* ── Lightning (storm) ──────────────────────────────────────────────────── */
let flash = 0, strikeTimer = rand(2,6), bolt = null;
function updateLightning(dt){
  if (cfg.weather !== 3) { flash = 0; bolt = null; return; }
  strikeTimer -= dt/60;
  if (strikeTimer <= 0){ strikeTimer = rand(3,8); flash = 1;
    const x = rand(W*0.2, W*0.8); bolt = [{x, y:0}]; let cx=x, cy=0;
    while (cy < H*0.6){ cy += rand(20,55); cx += rand(-40,40); bolt.push({x:cx,y:cy}); } }
  flash *= Math.pow(0.85, dt);
  if (flash < 0.02) { flash = 0; bolt = null; }
}

/* ── Weather rendering ──────────────────────────────────────────────────── */
function drawWeather(dt){
  const wind = windX + gust;
  switch (cfg.weather){
    case 1: { // snow
      ctx.fillStyle = '#fff';
      for (const p of parts){
        p.ph += 0.02*dt;
        p.y += p.sp*(0.4+p.z)*0.016*dt;
        p.x += (wind*(0.4+p.z) + Math.sin(p.ph)*p.sw*0.02)*dt;
        if (p.y>H+5){p.y=-5;p.x=rand(0,W);} if(p.x>W+5)p.x=-5; if(p.x<-5)p.x=W+5;
        ctx.globalAlpha = 0.35+p.z*0.55; const r=p.r*(0.5+p.z);
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.2832); ctx.fill();
      } ctx.globalAlpha=1; break; }
    case 2: case 3: { // rain / storm
      ctx.strokeStyle='rgba(190,210,235,0.5)'; ctx.lineCap='round';
      const ang = 0.18*wind; for (const p of parts){
        const vy=p.sp*(0.5+p.z)*0.016*dt, vx=ang*vy*6;
        p.y+=vy; p.x+=vx; if(p.y>H+10){p.y=-10;p.x=rand(0,W);} if(p.x>W+20)p.x-=W+40; if(p.x<-20)p.x+=W+40;
        ctx.globalAlpha=0.25+p.z*0.45; ctx.lineWidth=0.8+p.z*1.0;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-ang*p.len*3,p.y-p.len*(0.6+p.z)); ctx.stroke();
      } ctx.globalAlpha=1; break; }
    case 4: { // fog
      ctx.globalCompositeOperation='source-over';
      for (const p of parts){ p.x+=p.sp*0.016*dt*(0.6+wind*0.3); if(p.x-p.r>W)p.x=-p.r*2;
        ctx.globalAlpha=p.a; ctx.drawImage(fogSprite,p.x-p.r,p.y-p.r*0.6,p.r*2,p.r*1.2); }
      ctx.globalAlpha=1; break; }
    case 5: drawSunRays(dt); break;
    case 6: { // sparkle
      ctx.globalCompositeOperation='lighter';
      for (const p of parts){ p.ph+=p.sp*0.04*dt; const tw=Math.max(0,Math.sin(p.ph));
        ctx.globalAlpha=tw*0.9; const r=p.r*(0.6+tw); ctx.drawImage(glowSprite,p.x-r*4,p.y-r*4,r*8,r*8); }
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; break; }
    case 7: { // fireflies
      ctx.globalCompositeOperation='lighter';
      for (const p of parts){ p.ph+=p.sp*0.03*dt;
        p.vx+=rand(-1,1)*dt*0.4+wind*0.05; p.vy+=rand(-1,1)*dt*0.4; p.vx*=0.96; p.vy*=0.96;
        p.x+=p.vx*0.04*dt; p.y+=p.vy*0.04*dt;
        if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<H*0.2)p.vy+=0.5; if(p.y>H)p.vy-=0.5;
        const tw=0.4+0.6*(Math.sin(p.ph)*0.5+0.5); ctx.globalAlpha=tw*0.85;
        const r=3; ctx.fillStyle='rgba(255,240,170,1)';
        ctx.drawImage(glowSprite,p.x-r*4,p.y-r*4,r*8,r*8); }
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; break; }
    case 8: { // petals
      for (const p of parts){ p.rot+=p.vr*0.02*dt; p.x+=(p.vx+wind*2)*0.04*dt; p.y+=p.vy*0.04*dt;
        if(p.y>H+10){p.y=-10;p.x=rand(0,W);} if(p.x>W+10)p.x=-10; if(p.x<-10)p.x=W+10;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+Math.sin(p.x*0.02)*0.4);
        ctx.fillStyle=`hsla(${p.h},70%,72%,0.9)`; ctx.beginPath();
        ctx.ellipse(0,0,p.s,p.s*0.5,0,0,6.2832); ctx.fill(); ctx.restore(); }
      break; }
  }
}
let rayPhase = 0;
function drawSunRays(dt){
  rayPhase += 0.01*dt; const sx=W*0.78, sy=H*0.16;
  ctx.globalCompositeOperation='lighter';
  const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*0.5);
  glow.addColorStop(0,'rgba(255,240,200,0.18)'); glow.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
  const N=9, len=Math.hypot(W,H);
  for (let i=0;i<N;i++){ const a=2.3 + i/N*1.1 + Math.sin(rayPhase+i)*0.03;
    const wdt=(0.02+0.02*Math.abs(Math.sin(rayPhase*1.3+i)))*1.2;
    ctx.globalAlpha=0.05+0.05*Math.abs(Math.sin(rayPhase+i*1.7));
    ctx.fillStyle='rgba(255,245,215,1)'; ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(a-wdt)*len, sy+Math.sin(a-wdt)*len);
    ctx.lineTo(sx+Math.cos(a+wdt)*len, sy+Math.sin(a+wdt)*len);
    ctx.closePath(); ctx.fill(); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

/* ── Host listeners (Lively + Wallpaper Engine) ─────────────────────────── */
function applyProp(name, val){
  switch (name){
    case 'scene': cfg.scene=+val; loadScene(cfg.scene); break;
    case 'customUrl': cfg.customUrl=String(val); if(SCENES[cfg.scene]&&SCENES[cfg.scene].kind==='custom') loadScene(cfg.scene); break;
    case 'weather': cfg.weather=+val; buildWeather(); break;
    case 'intensity': cfg.intensity=+val; buildWeather(); break;
    case 'timeOfDay': cfg.timeOfDay=+val; applyGrade(); break;
    case 'parallax': cfg.parallax=!!val; break;
    case 'grain': cfg.grain=!!val; grainEl.style.opacity = val ? '0.05' : '0'; break;
  }
}
window.livelyPropertyListener = applyProp;
window.wallpaperPropertyListener = { applyUserProperties(props){
  for (const k in props){ let v=props[k].value;
    if (typeof v==='string' && /^\d+$/.test(v)) v=+v; applyProp(k, v); } } };

/* ── Pause when desktop hidden ──────────────────────────────────────────── */
let running = true;
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running){ last = performance.now(); requestAnimationFrame(frame); }
});

/* ── Main loop ──────────────────────────────────────────────────────────── */
let last = performance.now(), acc = 0; const FRAME_MS = 1000/45;
let kb = 0; // ken-burns phase
function frame(now){
  if (!running) return;
  acc += now - last; last = now;
  if (acc < FRAME_MS){ requestAnimationFrame(frame); return; }
  const dt = Math.min(3, acc/16.667); acc = 0;

  // ease mouse, wind, gust
  mouse.x += (mouse.tx-mouse.x)*0.05; mouse.y += (mouse.ty-mouse.y)*0.05;
  windX += (((cfg.weather===3)?1.6:0.3) + (mouse.x-0.5)*2.2 - windX)*0.03;
  gust *= 0.94;
  kb += 0.0009*dt;

  // photo drift (ken burns) + parallax → CSS transform on the active bg div
  const px = cfg.parallax ? (mouse.x-0.5) : 0, py = cfg.parallax ? (mouse.y-0.5) : 0;
  const driftX = Math.sin(kb)*22, driftY = Math.cos(kb*0.8)*16;
  const tf = `scale(1.08) translate(${(-px*26+driftX).toFixed(1)}px, ${(-py*18+driftY).toFixed(1)}px)`;
  bgFront.style.transform = tf; bgBack.style.transform = tf;

  // grain shimmer
  if (cfg.grain) grainEl.style.backgroundPosition = `${(Math.random()*96)|0}px ${(Math.random()*96)|0}px`;

  // clear FX layer (transparent over the photo)
  ctx.clearRect(0, 0, W, H);

  updateLightning(dt);
  drawWeather(dt);

  // ripples on click
  for (let i=ripples.length-1;i>=0;i--){ const r=ripples[i]; r.r+=3.5*dt; r.life-=0.02*dt;
    if (r.life<=0){ripples.splice(i,1);continue;}
    ctx.strokeStyle=`rgba(255,255,255,${r.life*0.3})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.2832); ctx.stroke(); }

  // lightning flash + bolt
  if (flash>0){ ctx.fillStyle=`rgba(220,230,255,${flash*0.5})`; ctx.fillRect(0,0,W,H);
    if (bolt){ ctx.strokeStyle=`rgba(255,255,255,${Math.min(1,flash*1.5)})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(bolt[0].x,bolt[0].y);
      for (let i=1;i<bolt.length;i++) ctx.lineTo(bolt[i].x,bolt[i].y); ctx.stroke(); } }

  requestAnimationFrame(frame);
}

/* ── Go ─────────────────────────────────────────────────────────────────── */
resize();
applyGrade();
loadScene(cfg.scene);
setInterval(() => { if (cfg.timeOfDay === 0) applyGrade(); }, 60000); // auto TOD refresh
requestAnimationFrame(frame);
</script>
</body>
