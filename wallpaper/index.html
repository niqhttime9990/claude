<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Drift — live wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  #c { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ──────────────────────────────────────────────────────────────────────────
   AURORA DRIFT  ·  an ambient, interactive live wallpaper
   ----------------------------------------------------------------------------
   · Glowing aurora "curtains" drift over a parallax, twinkling starfield.
   · The sky shifts colour with the time of day (dawn / day / dusk / night),
     or you can lock a theme.
   · Reacts to the mouse (subtle glow + parallax, click = ripple) and, where the
     host app provides it (Lively / Wallpaper Engine), pulses to your music.
   · Built to be calm at rest and easy on the GPU: capped DPR + frame rate, and
     it pauses itself when the desktop is hidden (e.g. a fullscreen game/video).
   Pure Canvas 2D, single file, zero dependencies.
   ────────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

/* ── User settings (live-editable via Lively / Wallpaper Engine listeners) ── */
const cfg = {
  speed: 50,        // 0..100  flow speed
  theme: 0,         // 0 Auto(time-of-day) 1 Aurora 2 Sunset 3 Ocean 4 Nebula 5 Mono
  brightness: 70,   // 0..100  aurora intensity
  stars: true,      // starfield on/off
  audio: true,      // react to music if host provides audio
  interactive: true // mouse parallax + glow
};

/* ── Sizing ─────────────────────────────────────────────────────────────── */
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5); // cap for wallpaper perf
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
  buildCurtainSprites();
}
window.addEventListener('resize', resize);

/* ── Smooth value noise (seeded) for organic curtain wander ─────────────── */
const PERM = new Uint8Array(512);
(function seed(s) {
  const p = new Uint8Array(256); for (let i = 0; i < 256; i++) p[i] = i;
  s = (s >>> 0) || 1;
  const rnd = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})(20260603);
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + (b - a) * t;
function noise1(x) {
  const X = Math.floor(x) & 255; x -= Math.floor(x);
  const u = fade(x);
  const a = (PERM[X] / 255) * 2 - 1, b = (PERM[X + 1] / 255) * 2 - 1;
  return lerp(a, b, u);
}

/* ── Themes: sky gradient + aurora hues ─────────────────────────────────── */
// Each theme: skyTop, skyBottom (hex), and an array of curtain hues [h,s].
const THEMES = {
  aurora: { top: '#040814', bot: '#0a1830', hues: [[150, 80], [170, 85], [120, 70], [195, 75]] },
  sunset: { top: '#1a0820', bot: '#3a1228', hues: [[330, 80], [18, 85], [285, 70], [45, 80]] },
  ocean:  { top: '#03081c', bot: '#072036', hues: [[200, 85], [220, 80], [185, 75], [250, 70]] },
  nebula: { top: '#0a0418', bot: '#1c0a30', hues: [[280, 80], [320, 75], [200, 70], [255, 85]] },
  mono:   { top: '#070707', bot: '#181820', hues: [[210, 12], [210, 8], [210, 18], [200, 10]] },
};
function hexLerp(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = pa >> 16, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = pb >> 16, bg = (pb >> 8) & 255, bb = pb & 255;
  return `rgb(${(ar + (br - ar) * t) | 0},${(ag + (bg - ag) * t) | 0},${(ab + (bb - ab) * t) | 0})`;
}
// Time-of-day blend between two named themes + brightness factor.
function autoSky() {
  const d = new Date();
  const h = d.getHours() + d.getMinutes() / 60; // 0..24
  // night → dawn → day → dusk → night, all reusing aurora-ish skies
  const night = { top: '#02030a', bot: '#060c1c', glow: 0.55 };
  const dawn  = { top: '#0a0818', bot: '#241a30', glow: 0.85 };
  const day   = { top: '#071026', bot: '#103050', glow: 0.45 };
  const dusk  = { top: '#160a1e', bot: '#341228', glow: 0.95 };
  let a, b, m;
  if (h < 5)        { a = night; b = night; m = 0; }
  else if (h < 8)   { a = night; b = dawn;  m = (h - 5) / 3; }
  else if (h < 11)  { a = dawn;  b = day;   m = (h - 8) / 3; }
  else if (h < 17)  { a = day;   b = day;   m = 0; }
  else if (h < 20)  { a = day;   b = dusk;  m = (h - 17) / 3; }
  else if (h < 22)  { a = dusk;  b = night; m = (h - 20) / 2; }
  else              { a = night; b = night; m = 0; }
  return {
    top: hexLerp(a.top, b.top, m),
    bot: hexLerp(a.bot, b.bot, m),
    glow: lerp(a.glow, b.glow, m),
  };
}
function currentTheme() {
  switch (cfg.theme) {
    case 1: return { ...THEMES.aurora, hueSet: THEMES.aurora.hues, glow: 1 };
    case 2: return { ...THEMES.sunset, hueSet: THEMES.sunset.hues, glow: 1 };
    case 3: return { ...THEMES.ocean,  hueSet: THEMES.ocean.hues,  glow: 1 };
    case 4: return { ...THEMES.nebula, hueSet: THEMES.nebula.hues, glow: 1 };
    case 5: return { ...THEMES.mono,   hueSet: THEMES.mono.hues,   glow: 0.8 };
    default: {
      const sky = autoSky();
      return { top: sky.top, bot: sky.bot, hueSet: THEMES.aurora.hues, glow: sky.glow };
    }
  }
}

/* ── Starfield (parallax + twinkle) ─────────────────────────────────────── */
let stars = [];
function buildStars() {
  const n = Math.round((W * H) / 5200);
  stars = [];
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H * 0.92,
      r: Math.random() * 1.3 + 0.2,
      depth: Math.random() * 0.8 + 0.2,        // for parallax
      tw: Math.random() * Math.PI * 2,         // twinkle phase
      sp: 0.4 + Math.random() * 1.6,           // twinkle speed
    });
  }
}

/* ── Aurora curtain glow sprites (pre-rendered per layer for speed) ─────── */
const LAYERS = 4;
let sprites = [];
function buildCurtainSprites() {
  const th = currentTheme();
  sprites = [];
  const sh = 360, sw = 26;
  for (let L = 0; L < LAYERS; L++) {
    const [hue, sat] = th.hueSet[L % th.hueSet.length];
    const s = document.createElement('canvas');
    s.width = sw; s.height = sh;
    const g = s.getContext('2d');
    // vertical glow: bright low-middle, fading up into the sky and down to base
    const grad = g.createLinearGradient(0, 0, 0, sh);
    grad.addColorStop(0.00, `hsla(${hue},${sat}%,60%,0)`);
    grad.addColorStop(0.55, `hsla(${hue},${sat}%,58%,0.55)`);
    grad.addColorStop(0.82, `hsla(${hue + 12},${sat}%,68%,0.9)`);
    grad.addColorStop(1.00, `hsla(${hue + 20},${Math.min(100, sat + 10)}%,72%,0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, sw, sh);
    // feather horizontal edges so overlapping columns merge smoothly
    g.globalCompositeOperation = 'destination-in';
    const hg = g.createLinearGradient(0, 0, sw, 0);
    hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(0.5, 'rgba(0,0,0,1)'); hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0, 0, sw, sh);
    sprites.push(s);
  }
}

/* ── Shooting stars ─────────────────────────────────────────────────────── */
let shooters = [];
function maybeShooter(dt) {
  if (Math.random() < 0.0016 * dt && shooters.length < 3) {
    const fromLeft = Math.random() < 0.5;
    shooters.push({
      x: fromLeft ? Math.random() * W * 0.4 : W - Math.random() * W * 0.4,
      y: Math.random() * H * 0.4,
      vx: (fromLeft ? 1 : -1) * (5 + Math.random() * 4),
      vy: 2 + Math.random() * 2, life: 1,
    });
  }
}

/* ── Mouse / ripples ────────────────────────────────────────────────────── */
const mouse = { x: W / 2, y: H / 2, tx: W / 2, ty: H / 2, active: false };
let ripples = [];
function onMove(e) {
  const s = e.touches ? e.touches[0] : e;
  mouse.tx = s.clientX; mouse.ty = s.clientY; mouse.active = true;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('mousedown', e => { onMove(e); ripples.push({ x: mouse.tx, y: mouse.ty, r: 0, life: 1 }); });
window.addEventListener('touchstart', e => { onMove(e); ripples.push({ x: mouse.tx, y: mouse.ty, r: 0, life: 1 }); });

/* ── Audio reactivity (Lively + Wallpaper Engine) ───────────────────────── */
let audioEnergy = 0, audioTarget = 0;
function feedAudio(arr) {
  if (!arr || !arr.length) return;
  let s = 0; const n = Math.min(48, arr.length);   // emphasise lows/mids
  for (let i = 0; i < n; i++) s += Math.abs(arr[i]);
  audioTarget = Math.min(1.6, (s / n) * 2.2);
}
// Lively
window.livelyAudioListener = feedAudio;
// Wallpaper Engine
if (typeof window.wallpaperRegisterAudioListener === 'function') {
  window.wallpaperRegisterAudioListener(feedAudio);
}

/* ── Property listeners (host settings UI → live updates) ───────────────── */
function applyProp(name, val) {
  switch (name) {
    case 'speed': cfg.speed = +val; break;
    case 'brightness': cfg.brightness = +val; break;
    case 'theme': cfg.theme = +val; buildCurtainSprites(); break;
    case 'stars': cfg.stars = !!val; break;
    case 'audio': cfg.audio = !!val; break;
    case 'interactive': cfg.interactive = !!val; break;
  }
}
// Lively: called with (name, val) for each property
window.livelyPropertyListener = applyProp;
// Wallpaper Engine: called with a properties object
window.wallpaperPropertyListener = {
  applyUserProperties(props) {
    for (const k in props) {
      const v = props[k].value;
      applyProp(k, typeof v === 'string' && /^\d+$/.test(v) ? +v : v);
    }
  }
};

/* ── Pause when desktop is hidden (fullscreen apps) ─────────────────────── */
let running = true;
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running) { last = performance.now(); requestAnimationFrame(frame); }
});

/* ── Render ─────────────────────────────────────────────────────────────── */
let t = 0, last = performance.now();
const FRAME_MS = 1000 / 45; // soft cap ~45fps to save GPU
let acc = 0, skyColTop = '#04060e', skyColBot = '#0a1830';

function frame(now) {
  if (!running) return;
  const real = now - last; last = now;
  acc += real;
  if (acc < FRAME_MS) { requestAnimationFrame(frame); return; }
  const dt = Math.min(3, acc / 16.667); acc = 0;

  const sp = (0.2 + cfg.speed / 100 * 1.3);
  t += dt * 0.006 * sp;

  // ease audio + mouse
  audioEnergy += (audioTarget - audioEnergy) * 0.12;
  audioTarget *= 0.96;
  mouse.x += (mouse.tx - mouse.x) * 0.06;
  mouse.y += (mouse.ty - mouse.y) * 0.06;
  const aud = cfg.audio ? audioEnergy : 0;

  // sky (smoothly chase target colours so time-of-day shifts are gentle)
  const th = currentTheme();
  skyColTop = th.top; skyColBot = th.bot;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, skyColTop);
  sky.addColorStop(1, skyColBot);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const px = cfg.interactive ? (mouse.x / W - 0.5) : 0;
  const py = cfg.interactive ? (mouse.y / H - 0.5) : 0;

  // stars
  if (cfg.stars) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.tw += 0.02 * s.sp * dt;
      const tw = 0.45 + 0.55 * (Math.sin(s.tw) * 0.5 + 0.5);
      const sx = s.x - px * 40 * s.depth;
      const sy = s.y - py * 24 * s.depth;
      ctx.globalAlpha = tw * (0.5 + s.depth * 0.5);
      ctx.fillStyle = '#dfe8ff';
      ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // shooting stars
  maybeShooter(dt);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = shooters.length - 1; i >= 0; i--) {
    const m = shooters[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= 0.012 * dt;
    if (m.life <= 0 || m.x < -50 || m.x > W + 50) { shooters.splice(i, 1); continue; }
    const tx = m.x - m.vx * 6, ty = m.y - m.vy * 6;
    const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
    g.addColorStop(0, `rgba(255,255,255,${0.9 * m.life})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
  }

  // aurora curtains
  ctx.globalCompositeOperation = 'lighter';
  const bright = (cfg.brightness / 100) * th.glow;
  const step = 9;
  for (let L = 0; L < LAYERS; L++) {
    const sprite = sprites[L]; if (!sprite) continue;
    const depth = 0.4 + L * 0.2;
    const baseY = H * (0.30 + L * 0.085) + py * 30 * depth;
    const amp = H * (0.05 + L * 0.012);
    const ph = L * 11.3;
    const colW = step * 2.6;
    const tspd = t * (1 + L * 0.3);
    for (let x = -colW; x < W + colW; x += step) {
      const nx = x * 0.0016 + ph;
      const wander = noise1(nx + tspd) * amp + noise1(nx * 2.1 - tspd * 0.7) * amp * 0.5;
      const shimmer = 0.5 + 0.5 * Math.sin(x * 0.02 + tspd * 1.7 + L);
      const yTop = baseY + wander - px * 26 * depth;
      const hh = H * (0.26 + L * 0.05) * (0.8 + shimmer * 0.35) * (1 + aud * 0.7);
      ctx.globalAlpha = bright * (0.10 + shimmer * 0.12) * (1 + aud * 0.5);
      ctx.drawImage(sprite, x - colW / 2, yTop - hh * 0.72, colW, hh);
    }
  }
  ctx.globalAlpha = 1;

  // cursor glow
  if (cfg.interactive && mouse.active) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 160);
    g.addColorStop(0, 'rgba(150,200,255,0.10)');
    g.addColorStop(1, 'rgba(150,200,255,0)');
    ctx.fillStyle = g; ctx.fillRect(mouse.x - 160, mouse.y - 160, 320, 320);
  }
  // ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 4 * dt; r.life -= 0.02 * dt;
    if (r.life <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(170,210,255,${r.life * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
  }

  // gentle vignette for depth
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.3, W / 2, H * 0.55, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

/* ── Go ─────────────────────────────────────────────────────────────────── */
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
